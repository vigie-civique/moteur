<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Description et Open Graph : dans +layout.svelte, pas ici. Ce fichier est
         du HTML statique, il ne peut pas lire l'identité de l'instance — il a
         donc nommé une commune précise aussi longtemps qu'il l'a portée. -->
    <meta property="og:type" content="website" />
    <!-- La vigie sur fond rouge : l'envers du site public, pour ne pas
         confondre les deux onglets quand on relit. -->
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <!-- Avant tout CSS, le navigateur peint un fond : qu'il suive déjà le
         système plutôt que d'être blanc. -->
    <meta name="color-scheme" content="light dark" />
    %sveltekit.head%
    <!-- Thème choisi dans l'atelier, posé avant le premier rendu. Un fichier
         servi par l'atelier et non un script en ligne : la CSP n'accepte que
         'self' et les scripts signés au build (svelte.config.js). -->
    <script src="/theme.js"></script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
