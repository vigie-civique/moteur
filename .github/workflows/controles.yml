name: contrôles

# Ce que cette CI vérifie, et pourquoi elle est courte : les trois fonctions qui
# décident ce qui sort du dispositif — le filtre de publication, le classement
# de périmètre, et la liste des fichiers distribués. Chacune a laissé passer un
# défaut réel en août 2026, aucune n'était couverte.
#
# Elle ne collecte rien : pas de réseau, pas de clé, pas d'Ollama. Les tests
# tournent sur une instance factice et une base construite depuis db/schema.sql.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # La borne basse est celle qu'on annonce dans pyproject ; la haute est
        # proche de la machine de développement. Entre les deux, c'est vérifié.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dépendances de test
        # Pas requirements.txt : la suite ne doit dépendre ni des collecteurs ni
        # de l'API. Si un test se met à réclamer requests, c'est qu'il sort sur
        # le réseau, et il ne devrait pas. Les tests qui s'adressent à l'API font
        # exception et sont sautés ici — cf. le job `tests-deps`, qui les joue.
        run: pip install pytest
      - name: Tests
        run: python -m pytest -ra

  tests-deps:
    # Le job précédent saute ce qui exige l'API ou les collecteurs. Celui-ci
    # installe tout et rejoue la suite ENTIÈRE : sans lui, un fichier sauté
    # partout serait un contrôle mort, et c'est justement là que vit le verrou
    # d'origine — l'interface grise ce qu'elle interdit, mais elle ne protège
    # que celui qui l'utilise. Rien ne sort sur le réseau pour autant : le
    # client de test de FastAPI appelle l'application dans le même processus.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances
        run: pip install -r requirements.txt pytest
      - name: Suite entière
        # Un test SAUTÉ ici est un défaut, pas une information : tout est
        # installé, donc un skip dénonce un paquet absent de requirements.txt.
        # Deux collecteurs ont vécu des mois dans cet angle mort.
        run: |
          python -m pytest -ra | tee resultat.txt
          statut=${PIPESTATUS[0]}
          if [ "$statut" -ne 0 ]; then exit "$statut"; fi
          if grep -q '^SKIPPED' resultat.txt; then
            echo "::error::un test sauté alors que les dépendances sont installées"
            exit 1
          fi

  generique:
    # Séparé des tests : ce contrôle est l'admission du kit. Le voir échouer
    # seul dit immédiatement qu'une particularité locale est entrée dans le
    # moteur, sans avoir à lire un rapport de suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Le moteur ne nomme aucune commune
        env:
          VIGIE_INSTANCE: tests/instance_test.json
        run: python scripts/verifier_generique.py

  kit:
    # Fabrique l'archive distribuable sur un dépôt sans instance ni base : c'est
    # l'état d'un clone public. Une archive qui ne se construit pas là ne se
    # construira pas chez celui qui la reprend.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: L'archive se construit et ne contient rien d'interdit
        env:
          VIGIE_INSTANCE: tests/instance_test.json
        run: python scripts/build_kit.py

  site:
    # La chaîne complète sur une commune qui n'existe pas : base vierge au
    # schéma réel, snapshot, contrôle d'étanchéité, build. Elle ne publie rien,
    # elle vérifie que rien ne casse entre la base et le HTML — c'est le
    # parcours qu'un dépôt fraîchement cloné doit pouvoir suivre.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: public/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Base d'épreuve
        env:
          VIGIE_DB: db/ci.db
        run: python tests/amorcer_base_ci.py
      - name: Snapshot et contrôle d'étanchéité
        env:
          VIGIE_INSTANCE: tests/instance_test.json
          VIGIE_RULES: config/publication_rules.exemple.json
          VIGIE_DB: db/ci.db
        run: |
          python scripts/build_public_snapshot.py
          python scripts/verify_snapshot.py public/static/data
      - name: Build
        working-directory: public
        run: |
          npm ci
          npm run build
