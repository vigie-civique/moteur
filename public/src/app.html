<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Pas de <meta name="description"> ici : chaque page définit la sienne
         dans son <svelte:head>. La description générique faisait doublon sur
         les pages qui en avaient une, et ne décrivait aucune page en propre. -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
