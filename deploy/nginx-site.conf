# nginx — site PUBLIC d'une instance : des fichiers statiques, rien d'autre.
#
# `deploy/publier-site.sh` (cible `rsync` ou `local`) dépose `public/build/` dans
# le répertoire servi. Ce fichier dit à nginx comment le servir — ce que
# Cloudflare Pages faisait sans le dire, et qu'un serveur ordinaire ne devine
# pas :
#   - les pages sont écrites `budgets.html` et demandées `/budgets` ;
#   - `_redirects` n'est lu par personne (publier-site.sh ne l'envoie pas) : ses
#     règles sont traduites ICI, et une règle ajoutée là-bas s'ajoute ici ;
#   - les fichiers de `/_app/immutable/` portent leur empreinte dans leur nom,
#     ils se gardent un an ; tout le reste se revalide à chaque visite, sans
#     quoi une publication n'atteint ses lecteurs qu'à l'expiration du cache.
#
# Installer :
#   sudo certbot certonly --webroot -w /var/www/certbot -d commune.example.org
#   sudo cp deploy/nginx-site-entetes.conf /etc/nginx/snippets/vigie-site-entetes.conf
#   sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/vigie-site
#   sudo ln -s /etc/nginx/sites-available/vigie-site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# À adapter : server_name (3 fois), les chemins du certificat, et root — le
# `chemin` du bloc `publication` de config/instance.json.
#
# Contrôlé par la CI (`nginx -t`, job « nginx ») : ce fichier se charge.

server {
    listen 80;
    listen [::]:80;
    server_name commune.example.org;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://commune.example.org$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name commune.example.org;

    ssl_certificate     /etc/letsencrypt/live/commune.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/commune.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/vigie-site-entetes.conf;

    root /srv/site;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript application/json
               application/manifest+json application/xml text/xml
               text/css text/plain image/svg+xml;

    # ── Les règles de public/static/_redirects, traduites ───────────────────
    # /conflits-interets → /elus-et-structures (12/08/2026) : l'ancienne adresse
    # affirmait ce que la page prend soin de ne pas dire.
    location = /conflits-interets {
        include /etc/nginx/snippets/vigie-site-entetes.conf;
        return 301 /elus-et-structures;
    }

    # Une adresse à barre finale mène à la page, pas à un 404.
    location ~ ^(.+)/$ {
        include /etc/nginx/snippets/vigie-site-entetes.conf;
        return 301 $1$is_args$args;
    }

    location /_app/immutable/ {
        include /etc/nginx/snippets/vigie-site-entetes.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/vigie-site-entetes.conf;
        # ⚠️ `$uri.html` EN PREMIER : SvelteKit écrit « budgets.html » ET un
        # dossier « budgets/ » qui ne contient que `__data.json`. Chercher
        # `$uri` d'abord servirait le dossier (403) à la place de la page.
        try_files $uri.html $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    error_page 404 /404.html;
}
