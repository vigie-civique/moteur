# nginx — atelier : SPA statique + proxy vers l'API locale.
#
# L'atelier est FACULTATIF, et ce qu'il sert n'est PAS filtré : la base de
# travail contient des pistes non vérifiées, des personnes sans rôle public et
# des liens de famille, tout ce que le site public écarte. Le mettre en ligne
# demande donc du TLS, une authentification, et l'idée claire qu'une fuite ici
# n'a pas les mêmes conséquences qu'une fuite sur le site public.
#
# Installer :
#   sudo cp deploy/nginx-atelier.conf /etc/nginx/sites-available/vigie-atelier
#   sudo ln -s /etc/nginx/sites-available/vigie-atelier /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d atelier.example.org   # ajoute le bloc 443 et redirige 80→443
#
# À adapter : server_name, et root (build de l'atelier : cd dashboard && npm run build → dist/).

server {
    listen 80;
    server_name atelier.example.org;

    root /opt/vigie/dashboard/dist;
    index index.html;

    # L'atelier n'a rien à faire dans un index de moteur de recherche.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # API FastAPI locale — le verrou JWT est dans l'application (api.py refuse
    # par défaut : toute route /api/ non authentifiée répond 401).
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA SvelteKit (adapter-static, fallback index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets versionnés par leur empreinte : immuables.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── Aperçu du site public ────────────────────────────────────────────────────
#
# L'atelier lance le site public sur le port 5180, branché sur le snapshot
# brouillon. Sur un poste local, l'exploitant y accède directement. Sur un
# atelier distant, non : le serveur d'aperçu n'écoute que sur la boucle locale,
# et rien ne le proxifiait — le bouton « Ouvrir l'aperçu » y renvoyait vers un
# `localhost` qui, depuis le poste qui consulte, ne désigne pas la machine de
# l'atelier. L'aperçu ne s'ouvrait jamais.
#
# Un SOUS-DOMAINE, et non un préfixe sous l'atelier : les liens du site public
# sont absolus (`href="/deliberations"`). Le servir sous `/apercu/` les
# casserait tous, et l'aperçu ne montrerait plus le site tel qu'il sera publié
# — ce qui est précisément sa seule raison d'être.
#
# Ce que cet hôte sert n'est PAS le site public : c'est un brouillon non publié,
# monté depuis une base de travail. Il se protège comme l'atelier, pas comme un
# site ouvert.
#
# À faire côté application : déclarer l'adresse dans l'environnement du service,
#   VIGIE_APERCU_URL=https://apercu.example.org
# sans quoi l'atelier continuera d'afficher le lien `localhost`.
#
# server {
#     listen 80;
#     server_name apercu.example.org;
#
#     add_header X-Robots-Tag "noindex, nofollow" always;
#
#     # Même mur que l'atelier : un brouillon n'est pas public.
#     auth_basic           "Aperçu Vigie Civique";
#     auth_basic_user_file /etc/nginx/.htpasswd-vigie;
#
#     location / {
#         proxy_pass http://127.0.0.1:5180;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Real-IP         $remote_addr;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#
#         # Le serveur d'aperçu pousse ses rechargements par websocket.
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade    $http_upgrade;
#         proxy_set_header Connection "upgrade";
#     }
# }
