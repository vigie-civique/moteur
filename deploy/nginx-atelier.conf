# nginx — atelier : SPA statique + proxy vers l'API locale.
#
# L'atelier est FACULTATIF, et ce qu'il sert n'est PAS filtré : la base de
# travail contient des pistes non vérifiées, des personnes sans rôle public et
# des liens de famille, tout ce que le site public écarte. Le mettre en ligne
# demande donc du TLS, une authentification, et l'idée claire qu'une fuite ici
# n'a pas les mêmes conséquences qu'une fuite sur le site public.
#
# DEUX VERROUS, et ils ne se marchent pas dessus :
#   1. le mur HTTP de nginx (`auth_basic`), commun à l'équipe — il occupe
#      l'en-tête `Authorization` ;
#   2. les comptes nommés de l'atelier — leur jeton voyage dans
#      `X-Atelier-Session` (cf. api_auth.py), précisément pour laisser
#      `Authorization` au mur.
# Le mur ne remplace pas les comptes : il retire l'atelier de la vue de qui
# balaie l'internet, et donne à fail2ban quelque chose à compter.
#
# Installer :
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-vigie-atelier equipe
#   sudo certbot certonly --webroot -w /var/www/certbot -d atelier.example.org
#   sudo cp deploy/nginx-atelier.conf /etc/nginx/sites-available/vigie-atelier
#   sudo ln -s /etc/nginx/sites-available/vigie-atelier /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# À adapter : server_name (4 fois), les chemins du certificat, et root (build de
# l'atelier : cd dashboard && npm run build → dist/).

# Bornes de débit, par adresse. La connexion est la seule route de l'API qui
# réponde sans session : c'est elle qu'on essaie de forcer.
limit_req_zone $binary_remote_addr zone=atelier_connexion:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=atelier_api:10m       rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name atelier.example.org;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://atelier.example.org$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atelier.example.org;

    ssl_certificate     /etc/letsencrypt/live/atelier.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atelier.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/vigie/dashboard/dist;
    index index.html;

    # Le mur, sur TOUT le serveur — API comprise.
    auth_basic           "Atelier Vigie Civique";
    auth_basic_user_file /etc/nginx/.htpasswd-vigie-atelier;

    # ⚠️ `add_header` ne s'hérite du `server` QUE si le `location` n'en déclare
    # aucun : un seul `add_header` dans un bloc fait tomber tous ceux-ci. Aucun
    # `location` ci-dessous n'en déclare — le cache des actifs passe par
    # `expires`, qui n'est pas un `add_header`. Garder cette propriété.
    #
    # La CSP est celle d'une application qui garde une session dans le
    # navigateur : aucun cadre, aucune origine tierce hors les tuiles du fond de
    # carte (à adapter à l'instance).
    #
    # `script-src` n'est PAS ici, et `default-src` non plus (il vaudrait pour les
    # scripts) : le build de l'atelier signe son bloc d'amorçage et pose lui-même
    # `script-src 'self' 'sha256-…'` dans une balise <meta> de la page
    # (dashboard/svelte.config.js, kit.csp). L'empreinte change à chaque build ;
    # la recopier ici la ferait mentir au premier déploiement. Deux politiques
    # s'additionnent : celle-ci tient tout le reste, la balise tient les scripts.
    add_header Content-Security-Policy "style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # L'atelier n'a rien à faire dans un index de moteur de recherche.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 1m;

    # La connexion et l'invitation — là où un mot de passe ou un jeton se
    # devine : bornées serré. Un 429 s'inscrit au journal d'erreurs, que
    # fail2ban lit (filtre nginx-limit-req).
    #
    # ⚠️ Ces deux-là SEULEMENT, pas tout `/api/auth/` : l'interface appelle
    # `/api/auth/me` et `/api/auth/refresh` à chaque page, et une salle de
    # réunion sort par UNE adresse. Huit bénévoles qui ouvrent l'atelier
    # ensemble dépassaient la borne, puis fail2ban bannissait la salle entière.
    location = /api/auth/login {
        limit_req zone=atelier_connexion burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/vigie-atelier-proxy.conf;
    }
    location /api/auth/invitation/ {
        limit_req zone=atelier_connexion burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/vigie-atelier-proxy.conf;
    }

    # Le dépôt de document : la seule route qui reçoive un fichier (50 Mo, la
    # borne de l'API). Partout ailleurs, 1 Mo.
    location = /api/atelier/documents {
        client_max_body_size 50m;
        limit_req zone=atelier_api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/vigie-atelier-proxy.conf;
    }

    # API FastAPI locale — le verrou de session est dans l'application (api.py
    # refuse par défaut : toute route /api/ non authentifiée répond 401).
    location /api/ {
        limit_req zone=atelier_api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/vigie-atelier-proxy.conf;
    }

    # Assets versionnés par leur empreinte : immuables.
    location /_app/immutable/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA SvelteKit (adapter-static, fallback index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── /etc/nginx/snippets/vigie-atelier-proxy.conf ─────────────────────────────
#
# À poser tel quel dans ce fichier (un `include` ne peut pas se définir ici) :
#
#     proxy_pass http://127.0.0.1:8765;
#     proxy_set_header Host              $host;
#     proxy_set_header X-Real-IP         $remote_addr;
#     proxy_set_header X-Forwarded-For   $remote_addr;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     # Le mot de passe du mur s'arrête à nginx : l'application n'a pas à le voir.
#     proxy_set_header Authorization     "";
#     proxy_read_timeout 300s;
#
# `X-Forwarded-For $remote_addr`, et non `$proxy_add_x_forwarded_for` : ce
# dernier RECOPIE ce que le client a envoyé, donc lui laisse choisir l'adresse
# que l'application croira voir. nginx est ici le seul proxy.

# ── Aperçu du site public ────────────────────────────────────────────────────
#
# L'atelier lance le site public sur le port 5180, branché sur le snapshot
# brouillon. Sur un poste local, l'exploitant y accède directement. Sur un
# atelier distant, non : le serveur d'aperçu n'écoute que sur la boucle locale,
# et rien ne le proxifiait — le bouton « Ouvrir l'aperçu » y renvoyait vers un
# `localhost` qui, depuis le poste qui consulte, ne désigne pas la machine de
# l'atelier. L'aperçu ne s'ouvrait jamais.
#
# Un SOUS-DOMAINE, et non un préfixe sous l'atelier : les liens du site public
# sont absolus (`href="/deliberations"`). Le servir sous `/apercu/` les
# casserait tous, et l'aperçu ne montrerait plus le site tel qu'il sera publié
# — ce qui est précisément sa seule raison d'être.
#
# Ce que cet hôte sert n'est PAS le site public : c'est un brouillon non publié,
# monté depuis une base de travail. Il se protège comme l'atelier, pas comme un
# site ouvert.
#
# À faire côté application : déclarer l'adresse dans l'environnement du service,
#   VIGIE_APERCU_URL=https://apercu.example.org
# sans quoi l'atelier continuera d'afficher le lien `localhost`.
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name apercu.example.org;
#     # … mêmes lignes ssl_* que l'atelier, avec le certificat de cet hôte …
#
#     add_header X-Robots-Tag "noindex, nofollow" always;
#
#     # Même mur que l'atelier : un brouillon n'est pas public.
#     auth_basic           "Atelier Vigie Civique";
#     auth_basic_user_file /etc/nginx/.htpasswd-vigie-atelier;
#
#     location / {
#         proxy_pass http://127.0.0.1:5180;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Real-IP         $remote_addr;
#         proxy_set_header X-Forwarded-For   $remote_addr;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_set_header Authorization     "";
#     }
# }
