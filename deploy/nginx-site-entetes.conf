# En-têtes de sécurité du site public — UN SEUL endroit, inclus partout.
#
# `add_header` ne s'hérite du bloc parent QUE si le bloc courant n'en déclare
# aucun : un seul `add_header` dans un `location` fait tomber tous ceux du
# `server`. Ce fichier est donc inclus dans le `server` ET dans chaque
# `location` de nginx-site.conf — un en-tête ajouté demain quelque part ne peut
# plus emporter les autres. `always` les pose aussi sur les réponses d'erreur.
#
# Installer : sudo cp deploy/nginx-site-entetes.conf /etc/nginx/snippets/vigie-site-entetes.conf
#
# Le site ne charge rien d'ailleurs (ni police, ni fond de carte, ni mesure
# d'audience) : `'self'` partout. `'unsafe-inline'` reste nécessaire, SvelteKit
# émet ses blocs d'hydratation en ligne, sans nonce reprenable.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
